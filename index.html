<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f0f0f'/%3E%3Crect x='3' y='3' width='18' height='18' rx='3' fill='none' stroke='%234f9dff' stroke-width='1.8'/%3E%3Cpath d='M7 15.5 10 12l2.5 3 1.5-1.8 3 3.8' fill='none' stroke='%234f9dff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='15.5' cy='8.5' r='1.5' fill='%234f9dff'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Image Fitter</title>
  </head>
  <body>
    <div id="app">
      <!-- Boot screen: shown until the wasm engine is instantiated in its worker -->
      <div class="boot" id="boot" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-title">Image Fitter</p>
        <p class="boot-status" id="bootStatus">Loading image engine…</p>
        <button type="button" class="chip boot-retry" id="bootRetry" hidden>Retry</button>
      </div>

      <div class="shell" id="appShell" hidden>
        <!-- Top action bar -->
        <header class="topbar">
          <div class="brand" aria-hidden="true">
            <span class="brand-mark" id="brandMark"></span>
            <span class="brand-name">Image Fitter</span>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" id="openBtn" aria-label="Open image" title="Open">
              <span id="openIcon"></span>
              <span class="sr-only">Open</span>
            </button>
            <button type="button" class="icon-btn" id="resetBtn" aria-label="Reset" title="Reset" disabled>
              <span id="resetIcon"></span>
              <span class="sr-only">Reset</span>
            </button>
            <button type="button" class="icon-btn icon-btn-accent" id="saveBtn" aria-label="Save image" title="Save" disabled>
              <span id="saveIcon"></span>
              <span class="sr-only">Save</span>
            </button>
          </div>
        </header>

        <!-- Image stage -->
        <main class="stage" id="stage" aria-label="Image preview">
          <canvas id="previewCanvas" class="preview-canvas" hidden></canvas>
          <span class="size-badge" id="sizeBadge" hidden><span id="sizeText"></span><span class="render-dot" id="renderDot" aria-label="Rendering"></span></span>

          <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Drop an image here or tap to open">
            <span class="dropzone-icon" id="dropzoneIcon"></span>
            <p class="dropzone-title">Drop an image here or tap to open</p>
            <p class="dropzone-subtitle">JPG, PNG, WebP, GIF</p>
          </div>

          <div class="stage-drag-overlay" id="dragOverlay" hidden>
            <span id="dragOverlayIcon"></span>
            <p>Release to drop</p>
          </div>

          <input type="file" id="fileInput" accept="image/*" hidden />
        </main>

        <!-- Contextual option panel for the active tool -->
        <section class="option-panel" id="optionPanel" aria-label="Tool options"></section>

        <!-- Bottom tool strip -->
        <nav class="tool-strip" id="toolStrip" aria-label="Tools">
          <button type="button" class="tool-tab" id="toolTab-ratio" data-tool="ratio" aria-pressed="false">
            <span class="tool-tab-icon" id="toolIcon-ratio"></span>
            <span class="tool-tab-label">Ratio</span>
          </button>
          <button type="button" class="tool-tab" id="toolTab-size" data-tool="size" aria-pressed="false">
            <span class="tool-tab-icon" id="toolIcon-size"></span>
            <span class="tool-tab-label">Size</span>
          </button>
          <button type="button" class="tool-tab" id="toolTab-position" data-tool="position" aria-pressed="false">
            <span class="tool-tab-icon" id="toolIcon-position"></span>
            <span class="tool-tab-label">Position</span>
          </button>
          <button type="button" class="tool-tab" id="toolTab-background" data-tool="background" aria-pressed="false">
            <span class="tool-tab-icon" id="toolIcon-background"></span>
            <span class="tool-tab-label">Background</span>
          </button>
        </nav>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
